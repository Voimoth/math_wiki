<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>数学 Wiki 知识图谱</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { margin:0; background:#1e1e2e; overflow:hidden; font-family:'Segoe UI',sans-serif; }
  #info { position:fixed; top:10px; left:10px; color:#cdd6f4; background:rgba(30,30,46,0.85);
          padding:8px 14px; border-radius:8px; font-size:13px; z-index:10; }
  .legend { position:fixed; bottom:10px; left:10px; color:#cdd6f4; font-size:12px; z-index:10; }
  .legend span { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  .link { stroke:#999; stroke-opacity:0.35; }
  .node circle { stroke:#fff; stroke-width:1px; cursor:pointer; }
  .node text { fill:#cdd6f4; font-size:11px; pointer-events:none; text-shadow:0 0 3px #000; }
  .tooltip { position:absolute; display:none; background:#313244; color:#cdd6f4; padding:6px 10px;
             border-radius:6px; font-size:12px; pointer-events:none; z-index:20; }
</style>
</head>
<body>
<div id="info">📚 数学 Wiki 知识图谱 — 19 节点 / 120 连接(可拖动、滚轮缩放)</div>
<div class="legend">
  <span style="background:#4f9cf9"></span>概念 <span style="background:#f9a14f"></span>实体
  <span style="background:#9b6cf9"></span>对比 <span style="background:#6cf9a1"></span>查询
  <span style="background:#a0a0a0"></span>其他
</div>
<div class="tooltip"></div>
<script>
const nodes = [{"id":"fourier-series-introductions","name":"Fourier 级数的多种引入方式","type":"comparison"},{"id":"analysis2-review","name":"分析II(下) 全册复习:因果链地图","type":"concept"},{"id":"convergence-of-fourier-series","name":"傅里叶级数的收敛理论","type":"concept"},{"id":"dirichlet-kernel","name":"Dirichlet 核","type":"concept"},{"id":"fejer-kernel","name":"Fejér 核与 Cesàro 平均","type":"concept"},{"id":"fourier-applications","name":"傅里叶分析的应用","type":"concept"},{"id":"fourier-learning-path","name":"傅里叶级数学习路径","type":"concept"},{"id":"fourier-series","name":"傅里叶级数","type":"concept"},{"id":"fourier-transform","name":"傅里叶变换","type":"concept"},{"id":"gibbs-phenomenon","name":"Gibbs 现象","type":"concept"},{"id":"orthogonal-system","name":"正交函数系","type":"concept"},{"id":"parseval-identity","name":"Parseval 恒等式","type":"concept"},{"id":"separation-of-variables","name":"分离变量法","type":"concept"},{"id":"fourier-handout-2026","name":"中法班 Fourier 讲义(殷浩)","type":"entity"},{"id":"fourier-literature","name":"傅里叶级数入门文献库","type":"entity"},{"id":"stein-shakarchi-fourier-analysis","name":"Stein-Shakarchi 傅里叶分析","type":"entity"},{"id":"index","name":"index","type":"page"},{"id":"log","name":"log","type":"page"},{"id":"schema","name":"页面标题","type":"entity | concept | comparison | query | summary"}];
const edges = [{"source":"fourier-series-introductions","target":"orthogonal-system"},{"source":"fourier-series-introductions","target":"fourier-series"},{"source":"fourier-series-introductions","target":"separation-of-variables"},{"source":"fourier-series-introductions","target":"orthogonal-system"},{"source":"fourier-series-introductions","target":"fourier-handout-2026"},{"source":"analysis2-review","target":"convergence-of-fourier-series"},{"source":"convergence-of-fourier-series","target":"fejer-kernel"},{"source":"convergence-of-fourier-series","target":"gibbs-phenomenon"},{"source":"convergence-of-fourier-series","target":"fourier-series"},{"source":"convergence-of-fourier-series","target":"dirichlet-kernel"},{"source":"convergence-of-fourier-series","target":"fejer-kernel"},{"source":"convergence-of-fourier-series","target":"parseval-identity"},{"source":"convergence-of-fourier-series","target":"gibbs-phenomenon"},{"source":"convergence-of-fourier-series","target":"orthogonal-system"},{"source":"dirichlet-kernel","target":"convergence-of-fourier-series"},{"source":"dirichlet-kernel","target":"fejer-kernel"},{"source":"dirichlet-kernel","target":"fourier-series"},{"source":"dirichlet-kernel","target":"fejer-kernel"},{"source":"dirichlet-kernel","target":"convergence-of-fourier-series"},{"source":"dirichlet-kernel","target":"gibbs-phenomenon"},{"source":"fejer-kernel","target":"convergence-of-fourier-series"},{"source":"fejer-kernel","target":"dirichlet-kernel"},{"source":"fejer-kernel","target":"convergence-of-fourier-series"},{"source":"fejer-kernel","target":"fourier-series"},{"source":"fourier-applications","target":"fejer-kernel"},{"source":"fourier-applications","target":"fourier-series"},{"source":"fourier-applications","target":"fourier-transform"},{"source":"fourier-applications","target":"fourier-transform"},{"source":"fourier-applications","target":"fourier-series"},{"source":"fourier-applications","target":"parseval-identity"},{"source":"fourier-applications","target":"fejer-kernel"},{"source":"fourier-applications","target":"fourier-handout-2026"},{"source":"fourier-learning-path","target":"fourier-handout-2026"},{"source":"fourier-learning-path","target":"fourier-series"},{"source":"fourier-learning-path","target":"orthogonal-system"},{"source":"fourier-learning-path","target":"dirichlet-kernel"},{"source":"fourier-learning-path","target":"convergence-of-fourier-series"},{"source":"fourier-learning-path","target":"fejer-kernel"},{"source":"fourier-learning-path","target":"orthogonal-system"},{"source":"fourier-learning-path","target":"parseval-identity"},{"source":"fourier-learning-path","target":"fourier-applications"},{"source":"fourier-learning-path","target":"fourier-transform"},{"source":"fourier-learning-path","target":"fourier-applications"},{"source":"fourier-learning-path","target":"stein-shakarchi-fourier-analysis"},{"source":"fourier-learning-path","target":"fourier-handout-2026"},{"source":"fourier-learning-path","target":"fourier-series"},{"source":"fourier-learning-path","target":"convergence-of-fourier-series"},{"source":"fourier-learning-path","target":"fourier-transform"},{"source":"fourier-series","target":"convergence-of-fourier-series"},{"source":"fourier-series","target":"orthogonal-system"},{"source":"fourier-series","target":"parseval-identity"},{"source":"fourier-series","target":"orthogonal-system"},{"source":"fourier-series","target":"dirichlet-kernel"},{"source":"fourier-series","target":"fejer-kernel"},{"source":"fourier-series","target":"convergence-of-fourier-series"},{"source":"fourier-series","target":"parseval-identity"},{"source":"fourier-series","target":"gibbs-phenomenon"},{"source":"fourier-transform","target":"parseval-identity"},{"source":"fourier-transform","target":"fourier-series"},{"source":"fourier-transform","target":"fourier-applications"},{"source":"fourier-transform","target":"fourier-series"},{"source":"fourier-transform","target":"fourier-applications"},{"source":"fourier-transform","target":"parseval-identity"},{"source":"fourier-transform","target":"fourier-handout-2026"},{"source":"gibbs-phenomenon","target":"dirichlet-kernel"},{"source":"gibbs-phenomenon","target":"fejer-kernel"},{"source":"gibbs-phenomenon","target":"fourier-series"},{"source":"gibbs-phenomenon","target":"dirichlet-kernel"},{"source":"gibbs-phenomenon","target":"fejer-kernel"},{"source":"gibbs-phenomenon","target":"convergence-of-fourier-series"},{"source":"orthogonal-system","target":"parseval-identity"},{"source":"orthogonal-system","target":"fourier-series"},{"source":"orthogonal-system","target":"parseval-identity"},{"source":"orthogonal-system","target":"convergence-of-fourier-series"},{"source":"parseval-identity","target":"orthogonal-system"},{"source":"parseval-identity","target":"fejer-kernel"},{"source":"parseval-identity","target":"orthogonal-system"},{"source":"parseval-identity","target":"convergence-of-fourier-series"},{"source":"parseval-identity","target":"fourier-series"},{"source":"separation-of-variables","target":"fourier-series"},{"source":"separation-of-variables","target":"fourier-series"},{"source":"separation-of-variables","target":"fourier-applications"},{"source":"separation-of-variables","target":"fourier-handout-2026"},{"source":"fourier-handout-2026","target":"fourier-series"},{"source":"fourier-handout-2026","target":"fourier-series"},{"source":"fourier-handout-2026","target":"dirichlet-kernel"},{"source":"fourier-handout-2026","target":"convergence-of-fourier-series"},{"source":"fourier-handout-2026","target":"fejer-kernel"},{"source":"fourier-handout-2026","target":"orthogonal-system"},{"source":"fourier-handout-2026","target":"parseval-identity"},{"source":"fourier-handout-2026","target":"fourier-applications"},{"source":"fourier-handout-2026","target":"fourier-transform"},{"source":"fourier-handout-2026","target":"fourier-transform"},{"source":"fourier-handout-2026","target":"fourier-literature"},{"source":"fourier-handout-2026","target":"fourier-learning-path"},{"source":"fourier-handout-2026","target":"fourier-series"},{"source":"fourier-literature","target":"stein-shakarchi-fourier-analysis"},{"source":"fourier-literature","target":"fourier-series"},{"source":"fourier-literature","target":"convergence-of-fourier-series"},{"source":"fourier-literature","target":"parseval-identity"},{"source":"fourier-literature","target":"fourier-learning-path"},{"source":"stein-shakarchi-fourier-analysis","target":"fourier-series"},{"source":"stein-shakarchi-fourier-analysis","target":"convergence-of-fourier-series"},{"source":"stein-shakarchi-fourier-analysis","target":"fejer-kernel"},{"source":"index","target":"fourier-handout-2026"},{"source":"index","target":"fourier-literature"},{"source":"index","target":"stein-shakarchi-fourier-analysis"},{"source":"index","target":"analysis2-review"},{"source":"index","target":"convergence-of-fourier-series"},{"source":"index","target":"dirichlet-kernel"},{"source":"index","target":"fejer-kernel"},{"source":"index","target":"fourier-applications"},{"source":"index","target":"fourier-learning-path"},{"source":"index","target":"fourier-series"},{"source":"index","target":"fourier-transform"},{"source":"index","target":"gibbs-phenomenon"},{"source":"index","target":"orthogonal-system"},{"source":"index","target":"parseval-identity"},{"source":"index","target":"separation-of-variables"},{"source":"index","target":"fourier-series-introductions"}];
const typeColors = {"concept":"#4f9cf9","entity":"#f9a14f","comparison":"#9b6cf9","query":"#6cf9a1","summary":"#f96c6c","page":"#a0a0a0"};
const w = window.innerWidth, h = window.innerHeight;
const svg = d3.select('body').append('svg').attr('width', w).attr('height', h);
const g = svg.append('g');
const zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(90))
  .force('charge', d3.forceManyBody().strength(-280))
  .force('center', d3.forceCenter(w/2, h/2))
  .force('collide', d3.forceCollide(22));

const link = g.append('g').selectAll('line').data(edges).join('line')
  .attr('class', 'link').attr('stroke-width', 0.8);

const node = g.append('g').selectAll('g').data(nodes).join('g')
  .call(d3.drag().on('start', dragstart).on('drag', dragged).on('end', dragend));

node.append('circle').attr('r', d => d.type === 'concept' ? 9 : 7)
  .attr('fill', d => typeColors[d.type] || '#a0a0a0');

node.append('text').text(d => d.name)
  .attr('dx', 14).attr('dy', 4);

const tooltip = d3.select('.tooltip');
node.on('mouseover', (e, d) => {
  tooltip.style('display','block').html('<b>' + d.name + '</b><br>' + (d.type));
}).on('mousemove', e => {
  tooltip.style('left', (e.pageX+12)+'px').style('top', (e.pageY+12)+'px');
}).on('mouseout', () => tooltip.style('display','none'))
  .on('click', (e, d) => { window.open('file:///E:/Wiki/' + 'index.md', '_blank'); });

simulation.on('tick', () => {
  link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  node.attr('transform', d => 'translate('+d.x+','+d.y+')');
});

function dragstart(e, d) { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragend(e, d) { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }
</script>
</body>
</html>
