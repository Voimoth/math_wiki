<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480">
  <rect width="760" height="480" fill="#ffffff"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer silhouette of the sphere -->
    <ellipse cx="380" cy="235" rx="245" ry="155" stroke="#202124" stroke-width="3"/>
    <!-- rear half of the latitude circle, hidden by the sphere -->
    <path d="M135,235 C135,185 245,145 380,145 C515,145 625,185 625,235" stroke="#687078" stroke-width="2.5" stroke-dasharray="9 8"/>
    <!-- front half of the latitude circle -->
    <path d="M135,235 C135,285 245,325 380,325 C515,325 625,285 625,235" stroke="#202124" stroke-width="3"/>
    <!-- an oblique diameter: rear portion dashed, visible portion solid -->
    <path d="M190,120 L380,235" stroke="#7b1e1e" stroke-width="4" stroke-dasharray="10 8"/>
    <path d="M380,235 L570,350" stroke="#7b1e1e" stroke-width="4"/>
    <!-- axis direction marker -->
    <path d="M380,235 L535,329" stroke="#7b1e1e" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.7"/>
  </g>
  <circle cx="380" cy="235" r="7" fill="#202124"/>
  <circle cx="190" cy="120" r="8" fill="#b3261e"/>
  <circle cx="570" cy="350" r="8" fill="#b3261e"/>
  <g font-family="Times New Roman, serif" font-size="30">
    <text x="160" y="112" fill="#b3261e">p</text>
    <text x="584" y="363" fill="#b3261e">−p</text>
    <text x="397" y="229" fill="#202124">O</text>
  </g>
  <text x="380" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#4b5563">sphère S² : diamètre oblique et ligne de latitude</text>
</svg>
